name: Build and deploy .NET Core application to Web App MadisonChurchConnect
on:
  push:
    branches:
      - master
env:
  AZURE_WEBAPP_NAME: MadisonChurchConnect
  AZURE_WEBAPP_PACKAGE_PATH: MadisonChurchConnect\published
  CONFIGURATION: Release
  DOTNET_CORE_VERSION: 8.0.x
  WORKING_DIRECTORY: MadisonChurchConnect
  # Define your base version here
  VERSION_PREFIX: 1.1

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_CORE_VERSION }}
      
      - name: Restore
        run: dotnet restore "${{ env.WORKING_DIRECTORY }}"
      
      # Added versioning to the Build step
      - name: Build
        run: |
          dotnet build "${{ env.WORKING_DIRECTORY }}" `
          --configuration ${{ env.CONFIGURATION }} `
          --no-restore `
          -p:Version=${{ env.VERSION_PREFIX }}.${{ github.run_number }}
          
      - name: Test
        run: dotnet test "${{ env.WORKING_DIRECTORY }}" --no-build
      
      # Added versioning to the Publish step to ensure consistency
      - name: Publish
        run: |
          dotnet publish "${{ env.WORKING_DIRECTORY }}" `
          --configuration ${{ env.CONFIGURATION }} `
          --no-build `
          --output "${{ env.AZURE_WEBAPP_PACKAGE_PATH }}" `
          -p:Version=${{ env.VERSION_PREFIX }}.${{ github.run_number }}

      - name: Publish Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

  deploy:
    runs-on: windows-latest
    needs: build
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: webapp
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
